  #  depends_on:
  #    - mosquitto


  caen_hvps:
    #image: centos:caen_hvps_test
    image: almalinux:caen_hvps_test
    platform: linux/amd64
    restart: always
    stdin_open: true
    depends_on:
      - mosquitto
    command: [ 'python3', 'control_ps.py', 'SY4527', 'mosquitto']

  # Simulators for Laptop Development
  caen_dummy:
    build: ./dummy
    command: python caen_sim.py
    depends_on:
      - mosquitto
    restart: always

  ph2_acf_dummy:
    build: ./dummy
    command: python ph2_acf_sim.py
    depends_on:
      - mosquitto
    restart: always

  # Original dummy modules...
