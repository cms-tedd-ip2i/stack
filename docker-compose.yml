
version: "3"
services:

  mosquitto:
    image: eclipse-mosquitto:2.0
    restart: always
    ports:
      - "1884:1883"
    expose:
      - "1883"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
      - ./mosquitto/config:/mosquitto/config

  influxdb:
    image: influxdb
    restart: always
    ports:
      - "8087:8086"
    expose:
      - "8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=dbuser
      - DOCKER_INFLUXDB_INIT_PASSWORD=password
      - DOCKER_INFLUXDB_INIT_ORG=cms-tedd
      - DOCKER_INFLUXDB_INIT_BUCKET=my-bucket  
    volumes:
      - influxdb2:/var/lib/influxdb2
      - ./influxdb/config:/etc/influxdb2

  telegraf:
    image: telegraf
    restart: always
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on: 
      - mosquitto
      - influxdb
    env_file:
      - my.env

  grafana:
    image: grafana/grafana
    ports:
      - "3001:3000"
    depends_on: 
      - influxdb
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
  nodered:
    build: ./node-red
    ports:
      - "1880:1880"
    volumes:
      - ./node-red/data:/data
      - ../config_files:/usr/src/node-red/files
      - shared_ph2acf_files:/shared_ph2acf_files
    depends_on: 
      - mosquitto

  ph2_acf:
    image: arnab-ph2-acf-env:latest
    #container_name: ph2_acf
    restart: always
    volumes:
      - ph2_acf_volume:/opt/Ph2_ACF
      - ./ph2_acf/settings:/opt/Ph2_ACF/settings/
      - shared_ph2acf_files:/shared_ph2acf_files  # Shared volume for XML files
    networks:
      - default
    depends_on:
      - mosquitto
    environment:
      - MQTT_BROKER=mosquitto
      - PYTHONUNBUFFERED=1

  web_server:
    #image: ghcr.io/cms-tedd-ip2i/tracker_dcs_web:0.2.1
    image: webtest
    # image: webserver_local
    restart: always
    stdin_open: true
    tty: true
    # port must be open even in production as it's a webserver open to outside
    # TODO: setup authentication
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
    ports:
      - "5000:8000"
    expose:
      - "8000"
    command: ["uvicorn", "tracker_dcs_web.web_server.app:app", "--host", "0.0.0.0"]
    volumes:
      - web_server:/app/files
    depends_on:
      - mosquitto

  #labview:
  #image: ghcr.io/cms-tedd-ip2i/tracker_dcs_web:0.2.0
  #  image: webtest
  # image: webserver_local
  #  restart: always
  #  command: ["dummy_labview", "http://web_server:8000", "dummy_labview/mapping.txt", "dummy_labview/header.txt", "dummy_labview/measures.txt"]
  #  depends_on:
  #    - web_server

    
